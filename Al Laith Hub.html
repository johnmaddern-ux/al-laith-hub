:root {
  --bg:#f0f2f7;--surface:#ffffff;--surface2:#f8f9fc;
  --sidebar-bg:#18233a;--sidebar-hover:rgba(255,255,255,.06);--sidebar-active:#243352;
  --sidebar-text:#7a8fb3;--sidebar-text-active:#ffffff;
  --fg:#1a2237;--fg-muted:#64748b;--border:#e2e8f0;
  --accent:#2563eb;--accent-light:#eff6ff;
  --green:#10b981;--amber:#f59e0b;--red:#ef4444;
  font-family:'Inter',system-ui,sans-serif;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1525;--surface:#1a2237;--surface2:#141d32;
  --sidebar-bg:#0a0f1e;--sidebar-active:#1a2540;
  --sidebar-text:#4d6080;--sidebar-text-active:#e2e8f0;
  --fg:#e2e8f0;--fg-muted:#94a3b8;--border:#263450;
  --accent:#3b82f6;--accent-light:#1e2d4d;
  --green:#10b981;--amber:#f59e0b;--red:#f87171;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1525;--surface:#1a2237;--surface2:#141d32;
  --sidebar-bg:#0a0f1e;--sidebar-active:#1a2540;
  --sidebar-text:#4d6080;--sidebar-text-active:#e2e8f0;
  --fg:#e2e8f0;--fg-muted:#94a3b8;--border:#263450;
  --accent:#3b82f6;--accent-light:#1e2d4d;
  --green:#10b981;--amber:#f59e0b;--red:#f87171;color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);display:flex;height:100%}

.sidebar{width:228px;min-width:228px;background:var(--sidebar-bg);display:flex;flex-direction:column;overflow-y:auto}
.sb-logo{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.06)}
.sb-brand{font-size:13px;font-weight:700;color:#fff;letter-spacing:.06em;text-transform:uppercase}
.sb-sub{font-size:11px;color:var(--sidebar-text);margin-top:2px}
.sb-label{font-size:10px;font-weight:600;color:var(--sidebar-text);letter-spacing:.1em;text-transform:uppercase;padding:16px 16px 6px}
.sb-item{display:flex;align-items:center;gap:8px;padding:7px 16px;font-size:13px;font-weight:500;color:var(--sidebar-text);cursor:pointer;transition:background .12s,color .12s;user-select:none}
.sb-item:hover{background:var(--sidebar-hover);color:var(--sidebar-text-active)}
.sb-item.active{background:var(--sidebar-active);color:var(--sidebar-text-active)}
.sb-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sb-count{margin-left:auto;font-size:11px;background:rgba(255,255,255,.08);color:var(--sidebar-text);border-radius:10px;padding:1px 7px;font-variant-numeric:tabular-nums}
.sb-divider{height:1px;background:rgba(255,255,255,.06);margin:6px 0}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:50px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.topbar-title{font-size:15px;font-weight:600}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.btn{padding:6px 14px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:none;font-family:inherit;transition:opacity .12s;white-space:nowrap}
.btn:hover{opacity:.85}
.btn-primary{background:var(--accent);color:#fff}
.btn-ghost{background:transparent;color:var(--fg-muted);border:1px solid var(--border)}
.view-tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;flex-shrink:0}
.vtab{padding:10px 14px;font-size:13px;font-weight:500;color:var(--fg-muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .12s,border-color .12s;user-select:none}
.vtab.active{color:var(--accent);border-bottom-color:var(--accent)}
.content{flex:1;overflow-y:auto;padding:18px 20px}

.section-hdr{display:flex;align-items:center;gap:8px;padding:10px 0 8px;cursor:pointer;user-select:none}
.chevron{width:14px;height:14px;color:var(--fg-muted);flex-shrink:0;transition:transform .15s}
.section-block.col .chevron{transform:rotate(-90deg)}
.section-name{font-size:13px;font-weight:600;flex:1}
.section-cnt{font-size:11px;color:var(--fg-muted);font-variant-numeric:tabular-nums}
.task-list{margin-left:22px;border-left:1px solid var(--border)}
.section-block.col .task-list{display:none}

.task-row{display:flex;align-items:flex-start;gap:10px;padding:7px 10px 7px 14px;cursor:pointer;border-radius:6px;transition:background .1s}
.task-row:hover{background:var(--surface)}
.task-row.sel{background:var(--accent-light)}
.chk{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;margin-top:2px;cursor:pointer;transition:border-color .12s,background .12s;display:flex;align-items:center;justify-content:center}
.chk:hover{border-color:var(--accent)}
.chk.done{background:var(--green);border-color:var(--green)}
.chk.done::after{content:'';width:6px;height:4px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px);display:block}
.task-body{flex:1;min-width:0}
.task-name{font-size:13px;font-weight:500;line-height:1.4}
.task-name.struck{text-decoration:line-through;color:var(--fg-muted)}
.task-meta{display:flex;align-items:center;gap:8px;margin-top:3px;flex-wrap:wrap}
.avatar{width:18px;height:18px;border-radius:50%;font-size:9px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.task-owner-txt{font-size:11px;color:var(--fg-muted)}
.task-due{font-size:11px;color:var(--fg-muted)}
.task-due.late{color:var(--red)}
.add-row{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 14px;border-radius:6px;color:var(--fg-muted);font-size:13px;cursor:pointer;transition:background .1s,color .1s}
.add-row:hover{background:var(--surface);color:var(--accent)}

.detail{width:370px;min-width:370px;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:width .2s ease,min-width .2s ease,opacity .2s}
.detail.closed{width:0;min-width:0;opacity:0;pointer-events:none}
.panel-hdr{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:8px}
.panel-close{margin-left:auto;background:none;border:none;cursor:pointer;color:var(--fg-muted);font-size:18px;line-height:1;padding:0;font-family:inherit;flex-shrink:0}
.panel-title{font-size:15px;font-weight:600;flex:1;line-height:1.3}
.panel-body{padding:14px 16px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.field-row{display:flex;align-items:flex-start;gap:10px}
.field-lbl{font-size:11px;font-weight:600;color:var(--fg-muted);letter-spacing:.05em;text-transform:uppercase;width:72px;flex-shrink:0;padding-top:2px}
.field-val{flex:1;font-size:13px;color:var(--fg);min-width:0}
.field-notes{font-size:13px;color:var(--fg);line-height:1.6;white-space:pre-wrap}
.sbadge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:500}
.badge-open{background:var(--accent-light);color:var(--accent)}
.badge-done{background:#d1fae5;color:#065f46}

.table-wrap{background:var(--surface);border-radius:8px;border:1px solid var(--border);overflow:hidden}
.tbl-hdr,.tbl-row{display:grid;grid-template-columns:1fr 130px 100px 90px;gap:8px;align-items:center}
.tbl-hdr{padding:9px 14px;background:var(--surface2);font-size:11px;font-weight:600;color:var(--fg-muted);letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--border)}
.tbl-row{padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.tbl-row:last-child{border-bottom:none}
.tbl-row:hover{background:var(--surface2)}
.tbl-task-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl-task-name.struck{text-decoration:line-through;color:var(--fg-muted)}

/* ── CASH FLOW VIEW ── */
.stat-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px}
.stat-label{font-size:11px;font-weight:600;color:var(--fg-muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
.stat-value{font-size:22px;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums;line-height:1.1}
.stat-sub{font-size:12px;color:var(--fg-muted);margin-top:4px}
.stat-tile.good .stat-value{color:var(--green)}
.stat-tile.warn .stat-value{color:var(--amber)}
.stat-tile.bad .stat-value{color:var(--red)}

.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin-bottom:16px}
.chart-title{font-size:13px;font-weight:600;margin-bottom:4px}
.chart-sub{font-size:12px;color:var(--fg-muted);margin-bottom:14px}
.chart-legend{display:flex;gap:16px;margin-bottom:12px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-muted)}
.legend-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}

.chart-wrap{position:relative;width:100%;overflow:hidden}
.chart-svg{display:block;width:100%}
.chart-tooltip{position:absolute;background:var(--fg);color:var(--bg);padding:8px 12px;border-radius:6px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap;z-index:10;line-height:1.6}

.resources-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:16px}
.resources-hdr{padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.resource-item{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);text-decoration:none;color:var(--fg);transition:background .1s}
.resource-item:last-child{border-bottom:none}
.resource-item:hover{background:var(--surface2)}
.resource-icon{width:32px;height:32px;border-radius:6px;background:#fce8e6;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}
.resource-name{font-size:13px;font-weight:500;flex:1}
.resource-date{font-size:11px;color:var(--fg-muted)}
.resource-badge{font-size:10px;font-weight:600;background:var(--accent-light);color:var(--accent);padding:2px 7px;border-radius:10px}
.resource-ext{font-size:11px;color:var(--fg-muted)}

/* cash balance view */
.balance-chart-wrap{position:relative;width:100%;overflow:hidden}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center}
.overlay[hidden]{display:none!important}
.modal{background:var(--surface);border-radius:10px;width:460px;max-width:calc(100vw - 32px);padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-title{font-size:15px;font-weight:600}
.fg{display:flex;flex-direction:column;gap:5px}
.fl{font-size:12px;font-weight:500;color:var(--fg-muted)}
.fi,.fs,.fta{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:13px;color:var(--fg);font-family:inherit;outline:none;transition:border-color .12s;width:100%}
.fi:focus,.fs:focus,.fta:focus{border-color:var(--accent)}
.fta{min-height:72px;resize:vertical}
.modal-btns{display:flex;justify-content:flex-end;gap:8px}

@media(max-width:680px){
  .sidebar{display:none}
  .detail{display:none}
  .tbl-hdr,.tbl-row{grid-template-columns:1fr 80px 80px}
  .tbl-hdr>:last-child,.tbl-row>:last-child{display:none}
  .stat-tiles{grid-template-columns:1fr 1fr}
}
</style>

function sbItem(id,icon,label,count,color){
  const active = (id==='actions'&&state.view==='actions')||(id!=='actions'&&state.projectId===id&&state.view!=='actions');
  const dot = color ? `<span class="sb-dot" style="background:${color}"></span>` : `<span style="font-size:13px;color:var(--sidebar-text)">${icon}</span>`;
  return `<div class="sb-item ${active?'active':''}" onclick="selectNav('${id}')">${dot}<span style="flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${label}</span>${count?`<span class="sb-count">${count}</span>`:''}</div>`;
}

function selectNav(id){
  if(id==='actions'){ state.view='actions'; state.subview='actions'; state.selectedTaskId=null; }
  else { state.view='list'; state.projectId=id; state.subview='list'; state.selectedTaskId=null; }
  render();
}

function renderTabs(){
  const isFinancial = state.projectId==='exco-fin' && state.view!=='actions';
  let tabs;
  if(state.view==='actions'){
    tabs=[{id:'all',label:'Open'},{id:'done',label:'Completed'},{id:'overdue',label:'Overdue'}];
  } else if(isFinancial){
    tabs=[{id:'list',label:'Agenda & Tasks'},{id:'cashflow',label:'Cash Flow'},{id:'actions',label:'Actions'}];
  } else {
    tabs=[{id:'list',label:'Agenda & Tasks'},{id:'actions',label:'Actions'}];
  }
  const html = tabs.map(t=>{
    let active;
    if(state.view==='actions') active = state.filter===t.id||(t.id==='all'&&state.filter==='all');
    else active = state.subview===t.id;
    return `<div class="vtab ${active?'active':''}" onclick="setTab('${t.id}')">${t.label}</div>`;
  }).join('');
  document.getElementById('viewTabs').innerHTML = html;
}

function setTab(id){
  if(state.view==='actions'){ state.filter=id==='all'?'all':id; renderTabs(); renderContent(); return; }
  if(id==='actions'&&state.view!=='actions'){ state.subview='actions'; render(); return; }
  state.subview = id;
  render();
}

function renderContent(){
  if(state.view==='actions'||state.subview==='actions'){ renderActionsView(); return; }
  if(state.subview==='cashflow'){ renderCashFlowView(); return; }

function drawBarChart(){
  const wrap = document.getElementById('barWrap'); if(!wrap) return;
  const W = wrap.clientWidth||600;
  const H = 220;
  const pad = {top:12,right:12,bottom:28,left:52};
  const pw = W-pad.left-pad.right;
  const ph = H-pad.top-pad.bottom;
  const n = 12;
  const groupW = pw/n;
  const barW = Math.max(3, groupW*0.33);
  const gap = barW*0.5;
  const maxV = Math.max(...CF.inflows,...CF.outflows)*1.08;
  const yScale = v=>(ph - (v/maxV)*ph);
  const yTicks = [0,10000,20000,30000,40000];

  const isDark = document.documentElement.getAttribute('data-theme')==='dark' || (window.matchMedia('(prefers-color-scheme:dark)').matches && document.documentElement.getAttribute('data-theme')!=='light');
  const gridC = isDark?'rgba(255,255,255,.08)':'rgba(0,0,0,.06)';
  const textC = isDark?'#94a3b8':'#64748b';
  const fgC = isDark?'#e2e8f0':'#1a2237';

  let svg = `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" style="overflow:visible">`;
  // grid
  yTicks.forEach(v=>{
    const y = pad.top + yScale(v);
    svg += `<line x1="${pad.left}" y1="${y}" x2="${pad.left+pw}" y2="${y}" stroke="${gridC}" stroke-width="1"/>`;
    svg += `<text x="${pad.left-6}" y="${y+4}" font-size="10" text-anchor="end" fill="${textC}">${v>=1000?(v/1000)+'k':v}</text>`;
  });
  // bars
  CF.months.forEach((m,i)=>{
    const fc = i >= CF.forecastFrom;
    const x = pad.left + i*groupW + groupW/2;
    const xIn = x - gap/2 - barW;
    const xOut = x + gap/2;
    const hIn = (CF.inflows[i]/maxV)*ph;
    const hOut = (CF.outflows[i]/maxV)*ph;
    const yIn = pad.top + ph - hIn;
    const yOut = pad.top + ph - hOut;
    const inC = fc ? 'rgba(37,99,235,.35)' : '#2563eb';
    const outC = fc ? 'rgba(245,158,11,.35)' : '#f59e0b';
    svg += `<rect class="bar" x="${xIn}" y="${yIn}" width="${barW}" height="${hIn}" fill="${inC}" rx="2" data-tip="${m} Inflows: AED ${fmtK(CF.inflows[i])}${fc?' (forecast)':''}"/>`;
    svg += `<rect class="bar" x="${xOut}" y="${yOut}" width="${barW}" height="${hOut}" fill="${outC}" rx="2" data-tip="${m} Outflows: AED ${fmtK(CF.outflows[i])}${fc?' (forecast)':''}"/>`;
    // x label
    svg += `<text x="${x}" y="${H-10}" font-size="10" text-anchor="middle" fill="${textC}">${m}</text>`;
    // forecast indicator
    if(i===CF.forecastFrom) svg += `<line x1="${x-groupW/2}" y1="${pad.top}" x2="${x-groupW/2}" y2="${pad.top+ph}" stroke="${gridC}" stroke-width="1.5" stroke-dasharray="4,3"/>`;
  });
  svg += `<text x="${pad.left+pw*0.77}" y="${pad.top+14}" font-size="10" fill="${textC}">← forecast</text>`;
  svg += '</svg>';
  wrap.querySelector('.chart-tooltip') && (wrap.querySelector('.chart-tooltip').id = 'barTip');
  const existing = wrap.querySelector('svg');
  if(existing) existing.remove();
  wrap.insertAdjacentHTML('afterbegin', svg);
  addBarHover('barWrap','barTip');
}

function addBarHover(wrapId,tipId){
  const wrap = document.getElementById(wrapId); if(!wrap) return;
  const tip = document.getElementById(tipId); if(!tip) return;
  wrap.querySelectorAll('.bar').forEach(bar=>{
    bar.addEventListener('mouseenter',function(e){
      tip.textContent = this.dataset.tip;
      tip.style.opacity='1';
    });
    bar.addEventListener('mousemove',function(e){
      const r = wrap.getBoundingClientRect();
      let x = e.clientX-r.left+12, y = e.clientY-r.top-36;
      if(x+160>r.width) x = e.clientX-r.left-160;
      tip.style.left=x+'px'; tip.style.top=y+'px';
    });
    bar.addEventListener('mouseleave',()=>{ tip.style.opacity='0'; });
  });
}

function drawBalanceChart(){
  const wrap = document.getElementById('balWrap'); if(!wrap) return;
  const W = wrap.clientWidth||600;
  const H = 160;
  const pad = {top:12,right:12,bottom:28,left:52};
  const pw = W-pad.left-pad.right;
  const ph = H-pad.top-pad.bottom;
  const n = 12;
  const minV = 0;
  const maxV = Math.max(...CF.balance)*1.1;
  const xOf = i => pad.left + (i/(n-1))*pw;
  const yOf = v => pad.top + ph - ((v-minV)/(maxV-minV))*ph;

  const isDark = document.documentElement.getAttribute('data-theme')==='dark' || (window.matchMedia('(prefers-color-scheme:dark)').matches && document.documentElement.getAttribute('data-theme')!=='light');
  const gridC = isDark?'rgba(255,255,255,.08)':'rgba(0,0,0,.06)';
  const textC = isDark?'#94a3b8':'#64748b';
  const fgC = isDark?'#e2e8f0':'#1a2237';
  const accentC = '#2563eb';

  const yTicks = [0,20000,40000,60000,80000];
  let svg = `<svg viewBox="0 0 ${W} ${H}" class="chart-svg" style="overflow:visible">`;
  yTicks.forEach(v=>{
    const y = yOf(v);
    svg += `<line x1="${pad.left}" y1="${y}" x2="${pad.left+pw}" y2="${y}" stroke="${gridC}" stroke-width="1"/>`;
    svg += `<text x="${pad.left-6}" y="${y+4}" font-size="10" text-anchor="end" fill="${textC}">${v>=1000?(v/1000)+'k':v}</text>`;
  });

  // forecast divider
  const fcX = xOf(CF.forecastFrom);
  svg += `<line x1="${fcX}" y1="${pad.top}" x2="${fcX}" y2="${pad.top+ph}" stroke="${gridC}" stroke-width="1.5" stroke-dasharray="4,3"/>`;
  svg += `<text x="${fcX+4}" y="${pad.top+12}" font-size="10" fill="${textC}">forecast</text>`;

  // area fill: actual part
  const actPts = CF.balance.slice(0, CF.forecastFrom+1).map((v,i)=>`${xOf(i)},${yOf(v)}`).join(' ');
  const actAreaPts = actPts + ` ${xOf(CF.forecastFrom)},${yOf(0)} ${xOf(0)},${yOf(0)}`;
  svg += `<polygon points="${actAreaPts}" fill="rgba(37,99,235,.1)"/>`;

  // forecast area
  const fcPts = CF.balance.slice(CF.forecastFrom).map((v,i)=>`${xOf(CF.forecastFrom+i)},${yOf(v)}`).join(' ');
  const fcAreaPts = fcPts + ` ${xOf(11)},${yOf(0)} ${xOf(CF.forecastFrom)},${yOf(0)}`;
  svg += `<polygon points="${fcAreaPts}" fill="rgba(37,99,235,.05)"/>`;

  // line actual
  const lineAct = CF.balance.slice(0, CF.forecastFrom+1).map((v,i)=>`${i===0?'M':'L'}${xOf(i)},${yOf(v)}`).join(' ');
  svg += `<path d="${lineAct}" fill="none" stroke="${accentC}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;

  // line forecast (dashed)
  const lineFc = CF.balance.slice(CF.forecastFrom).map((v,i)=>`${i===0?'M':'L'}${xOf(CF.forecastFrom+i)},${yOf(v)}`).join(' ');
  svg += `<path d="${lineFc}" fill="none" stroke="${accentC}" stroke-width="2" stroke-dasharray="5,4" stroke-linecap="round" stroke-linejoin="round"/>`;

  // dots + x labels
  CF.balance.forEach((v,i)=>{
    const fc = i>=CF.forecastFrom;
    svg += `<circle class="bal-dot" cx="${xOf(i)}" cy="${yOf(v)}" r="4" fill="${fc?'var(--surface)':''+accentC}" stroke="${accentC}" stroke-width="2" data-tip="${CF.months[i]}: AED ${fmtK(v)}${fc?' (forecast)':''}"/>`;
    svg += `<text x="${xOf(i)}" y="${H-10}" font-size="10" text-anchor="middle" fill="${textC}">${CF.months[i]}</text>`;
  });
  svg += '</svg>';
  const existing = wrap.querySelector('svg');
  if(existing) existing.remove();
  wrap.insertAdjacentHTML('afterbegin', svg);

  // hover
  const tip = document.getElementById('balTip'); if(!tip) return;
  wrap.querySelectorAll('.bal-dot').forEach(dot=>{
    dot.style.cursor='pointer';
    dot.addEventListener('mouseenter',function(e){
      tip.textContent=this.dataset.tip; tip.style.opacity='1';
    });
    dot.addEventListener('mousemove',function(e){
      const r=wrap.getBoundingClientRect();
      let x=e.clientX-r.left+12,y=e.clientY-r.top-36;
      if(x+160>r.width) x=e.clientX-r.left-160;
      tip.style.left=x+'px'; tip.style.top=y+'px';
    });
    dot.addEventListener('mouseleave',()=>{ tip.style.opacity='0'; });
  });
}

function fmtK(v){ return v>=1000?(v/1000).toFixed(1)+'k':String(v); }

// ── ACTIONS VIEW ────────────────────────────────────────────────────────────
function renderActionsView(){
  let tasks = allTasks();
  const f = state.filter;
  if(f==='done') tasks=tasks.filter(t=>t.status==='done');
  else if(f==='overdue') tasks=tasks.filter(t=>t.status!=='done'&&t.due&&t.due<today());
  else tasks=tasks.filter(t=>t.status!=='done');

  if(!tasks.length){
    document.getElementById('content').innerHTML='<div style="text-align:center;padding:48px;color:var(--fg-muted)"><div style="font-size:32px;margin-bottom:10px">✅</div><div style="font-size:15px;font-weight:600;color:var(--fg);margin-bottom:6px">No tasks here</div><div>Change filter or add tasks to a project.</div></div>';
    return;
  }
  let html = `<div class="table-wrap"><div class="tbl-hdr"><div>Task</div><div>Owner</div><div>Project</div><div>Due</div></div>`;
  tasks.forEach(t=>{
    const done=t.status==='done';
    const late=!done&&t.due&&t.due<today();
    const [ac,initials]=avatarFor(t.owner||'');
    html+=`<div class="tbl-row" onclick="selectTask('${t.id}')">
      <div class="tbl-task-name ${done?'struck':''}" style="display:flex;align-items:center;gap:8px">
        <div class="chk ${done?'done':''}" style="flex-shrink:0" onclick="toggleDone(event,'${t.id}')"></div>
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.name)}</span>
      </div>
      <div style="display:flex;align-items:center;gap:5px;font-size:12px">
        ${t.owner?`<div class="avatar" style="background:${ac};width:20px;height:20px;font-size:9px">${initials}</div><span>${esc(t.owner)}</span>`:'<span style="color:var(--fg-muted)">—</span>'}
      </div>
      <div style="font-size:12px;color:var(--fg-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t._proj)}</div>
      <div class="task-due ${late?'late':''}" style="font-size:12px">${t.due?fmtDate(t.due):'—'}</div>
    </div>`;
  });
  html+='</div>';
  document.getElementById('content').innerHTML=html;
}

// ── TASK DETAIL ─────────────────────────────────────────────────────────────
function selectTask(id){
  state.selectedTaskId=id; render();
  const found=findTask(id); if(!found){ closePanel(); return; }
  const {task:t,section:s,proj:p}=found;
  const done=t.status==='done';
  const [ac,initials]=avatarFor(t.owner||'');
  const late=!done&&t.due&&t.due<today();
  document.getElementById('panelTitle').textContent=t.name;
  document.getElementById('panelBody').innerHTML=`
    <div class="field-row"><span class="field-lbl">Status</span>
      <div><span class="sbadge ${done?'badge-done':'badge-open'}">${done?'✓ Completed':'○ Open'}</span></div>
    </div>
    <div class="field-row"><span class="field-lbl">Owner</span>
      <div class="field-val" style="display:flex;align-items:center;gap:6px">
        ${t.owner?`<div class="avatar" style="background:${ac}">${initials}</div>${esc(t.owner)}`:'<span style="color:var(--fg-muted)">Unassigned</span>'}
      </div>
    </div>
    <div class="field-row"><span class="field-lbl">Due</span>
      <div class="field-val ${late?'task-due late':''}">${t.due?fmtDate(t.due)+daysLabel(t.due):'Not set'}</div>
    </div>
    <div class="field-row"><span class="field-lbl">Project</span><div class="field-val">${esc(p.name)}</div></div>
    <div class="field-row"><span class="field-lbl">Section</span><div class="field-val" style="font-size:12px;color:var(--fg-muted)">${esc(s.name)}</div></div>
    ${t.notes?`<div><div class="field-lbl" style="margin-bottom:6px">Notes</div><div class="field-notes">${esc(t.notes)}</div></div>`:''}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">
      <button class="btn ${done?'btn-ghost':'btn-primary'}" onclick="toggleDonePanel('${t.id}')">${done?'Reopen':'Mark Complete'}</button>
      <button class="btn btn-ghost" onclick="openEditModal('${t.id}')">Edit</button>
      <button class="btn btn-ghost" style="color:var(--red);border-color:var(--red)" onclick="deleteTask('${t.id}')">Delete</button>
    </div>`;
  document.getElementById('detailPanel').classList.remove('closed');
}

function closePanel(){ state.selectedTaskId=null; document.getElementById('detailPanel').classList.add('closed'); }
function toggleDone(e,id){ e.stopPropagation(); const f=findTask(id); if(!f) return; f.task.status=f.task.status==='done'?'open':'done'; save(); if(state.selectedTaskId===id)selectTask(id); else render(); }
function toggleDonePanel(id){ const f=findTask(id); if(!f) return; f.task.status=f.task.status==='done'?'open':'done'; save(); render(); selectTask(id); }
function toggleSection(id){ const el=document.getElementById('sb_'+id); if(el) el.classList.toggle('col'); }

// ── MODALS ──────────────────────────────────────────────────────────────────
function openAddModal(projId,secId){
  const pid=projId||state.projectId;
  const proj=DB.projects.find(p=>p.id===pid); if(!proj) return;
  const secOptions=proj.sections.map(s=>`<option value="${s.id}" ${s.id===secId?'selected':''}>${s.name}</option>`).join('');
  showModal('Add Task',`
    <div class="fg"><label class="fl">Task name *</label><input class="fi" id="m-name" placeholder="What needs to be done?" autofocus></div>
    <div class="fg"><label class="fl">Section</label><select class="fs" id="m-sec">${secOptions}</select></div>
    <div class="fg"><label class="fl">Owner</label><select class="fs" id="m-owner">
      <option value="">Unassigned</option>
      ${Object.keys(OWNERS).map(k=>`<option>${k}</option>`).join('')}
      <option value="other">Other...</option>
    </select></div>
    <div class="fg" id="other-wrap" style="display:none"><label class="fl">Owner name</label><input class="fi" id="m-owner-other" placeholder="Name"></div>
    <div class="fg"><label class="fl">Due date</label><input class="fi" id="m-due" type="date"></div>
    <div class="fg"><label class="fl">Notes</label><textarea class="fta" id="m-notes" placeholder="Additional context..."></textarea></div>
  `,()=>submitAdd(pid),'Add Task');
  document.getElementById('m-owner').addEventListener('change',function(){
    document.getElementById('other-wrap').style.display=this.value==='other'?'block':'none';
  });
}

function submitAdd(pid){
  const name=document.getElementById('m-name').value.trim();
  if(!name){ document.getElementById('m-name').style.borderColor='var(--red)'; return false; }
  const ownerSel=document.getElementById('m-owner').value;
  const owner=ownerSel==='other'?(document.getElementById('m-owner-other').value.trim()||''):ownerSel;
  const proj=DB.projects.find(p=>p.id===pid);
  const sec=proj&&proj.sections.find(s=>s.id===document.getElementById('m-sec').value);
  if(!sec) return false;
  sec.tasks.push({id:'task_'+Date.now(),name,owner,status:'open',due:document.getElementById('m-due').value||null,notes:document.getElementById('m-notes').value.trim()});
  save(); render(); return true;
}

function openEditModal(taskId){
  const found=findTask(taskId); if(!found) return;
  const {task:t}=found;
  const ok=Object.keys(OWNERS).includes(t.owner);
  showModal('Edit Task',`
    <div class="fg"><label class="fl">Task name</label><input class="fi" id="m-name" value="${esc(t.name)}"></div>
    <div class="fg"><label class="fl">Owner</label><select class="fs" id="m-owner">
      <option value="">Unassigned</option>
      ${Object.keys(OWNERS).map(k=>`<option ${t.owner===k?'selected':''}>${k}</option>`).join('')}
      <option value="other" ${!ok&&t.owner?'selected':''}>Other...</option>
    </select></div>
    <div class="fg" id="other-wrap" style="display:${!ok&&t.owner?'block':'none'}"><label class="fl">Owner name</label><input class="fi" id="m-owner-other" value="${esc(!ok&&t.owner?t.owner:'')}"></div>
    <div class="fg"><label class="fl">Due date</label><input class="fi" id="m-due" type="date" value="${t.due||''}"></div>
    <div class="fg"><label class="fl">Notes</label><textarea class="fta" id="m-notes">${esc(t.notes||'')}</textarea></div>
  `,()=>submitEdit(taskId),'Save Changes');
  document.getElementById('m-owner').addEventListener('change',function(){
    document.getElementById('other-wrap').style.display=this.value==='other'?'block':'none';
  });
}

function submitEdit(taskId){
  const name=document.getElementById('m-name').value.trim();
  if(!name){ document.getElementById('m-name').style.borderColor='var(--red)'; return false; }
  const ownerSel=document.getElementById('m-owner').value;
  const owner=ownerSel==='other'?(document.getElementById('m-owner-other').value.trim()||''):ownerSel;
  const f=findTask(taskId); if(!f) return false;
  Object.assign(f.task,{name,owner,due:document.getElementById('m-due').value||null,notes:document.getElementById('m-notes').value.trim()});
  save(); render(); selectTask(taskId); return true;
}

function deleteTask(taskId){
  const f=findTask(taskId); if(!f) return;
  f.section.tasks=f.section.tasks.filter(t=>t.id!==taskId);
  save(); closePanel(); render();
}

function showModal(title,bodyHtml,onSubmit,submitLabel='Save'){
  document.getElementById('modal').innerHTML=`
    <div class="modal-title">${title}</div>
    <div id="modal-fields">${bodyHtml}</div>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="handleModalSubmit()">${submitLabel}</button>
    </div>`;
  window._modalSubmit=onSubmit;
  document.getElementById('modalOverlay').hidden=false;
  setTimeout(()=>{ const f=document.getElementById('modal').querySelector('input,select,textarea'); if(f) f.focus(); },50);
}
function handleModalSubmit(){ if(window._modalSubmit&&window._modalSubmit()!==false) closeModal(); }
function closeModal(){ document.getElementById('modalOverlay').hidden=true; window._modalSubmit=null; }

// ── UTILS ───────────────────────────────────────────────────────────────────
function today(){ return new Date().toISOString().slice(0,10); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(d){ if(!d) return ''; const [y,m,day]=d.split('-'); return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]+' '+parseInt(day); }
function daysLabel(d){ const diff=Math.round((new Date(d)-new Date(today()))/(864e5)); if(diff<0) return ` · ${Math.abs(diff)}d overdue`; if(diff===0) return ' · Today'; if(diff===1) return ' · Tomorrow'; return ` · ${diff}d`; }

document.getElementById('modalOverlay').addEventListener('click',function(e){ if(e.target===this) closeModal(); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ if(!document.getElementById('modalOverlay').hidden) closeModal(); else closePanel(); } });
window.addEventListener('resize',()=>{ if(state.subview==='cashflow') renderCashFlowView(); });

render();
</script>

</body></html>
